name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          # The explicit --frozen-lockfile step below is the install.
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build

      # pnpm deliberately stopped expanding ${NPM_TOKEN} in the project-level
      # .npmrc (>= 11.5.3, so a checked-out repo cannot exfiltrate env secrets).
      # The token therefore has to be written to the trusted user-level config,
      # and `whoami` fails the job loudly if it is missing or invalid — rather
      # than letting the registry answer an unauthenticated publish with a 404.
      - name: Authenticate with the npm registry
        run: |
          pnpm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          pnpm whoami
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
